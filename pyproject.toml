[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "leanverifier"
version = "0.1.0"
description = "Deterministic generator and CLI for LeanVerifier affine L-infinity margin checks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateo Petel" }]
dependencies = [
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "hypothesis==6.130.8",
  "ruff==0.11.2",
  "mypy==1.15.0",
]
build = [
  "build==1.2.2.post1",
  "setuptools==75.8.2",
  "wheel==0.45.1",
]
release = [
  "cyclonedx-bom==7.3.0",
]

[project.scripts]
leanverifier = "leanverifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["leanverifier*"]

[tool.setuptools.package-data]
leanverifier = [
  "py.typed",
  "resources/hashes.json",
  "resources/schemas/*.json",
  "resources/lean-project/lean-toolchain",
  "resources/lean-project/lakefile.toml",
  "resources/lean-project/lake-manifest.json",
  "resources/lean-project/LeanVerifier.lean",
  "resources/lean-project/LeanVerifier/**/*.lean",
  "resources/scripts/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["leanverifier"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "unit: fast pure-Python unit tests",
  "schema: JSON schema positive/negative tests",
  "integration: CLI integration flows",
  "positive: positive-path integration (may require lake)",
  "negative: negative-path integration",
  "mutation: audit mutation table via verify/audit/inspect",
  "security: path/injection/timeout/env hardening",
  "lean: requires lake + built LeanVerifier oleans",
  "hypothesis: property-based Hypothesis tests",
  "slow: long-running or full-matrix jobs",
]

[tool.coverage.run]
source = ["src/leanverifier"]
branch = true

[tool.uv]
package = true
