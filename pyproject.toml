[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leanverifier"
version = "0.1.0"
description = "Deterministic generator and CLI for LeanVerifier affine L-infinity margin checks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateo Petel" }]
dependencies = [
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==7.1.0",
  "hypothesis==6.130.8",
  "ruff==0.11.2",
  "mypy==1.15.0",
]

[project.scripts]
leanverifier = "leanverifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["leanverifier*"]

[tool.setuptools.package-data]
leanverifier = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["leanverifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/leanverifier"]
branch = true
