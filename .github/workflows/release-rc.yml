name: Release RC scaffolding

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Prerelease tag (e.g. v0.1.0-rc1)"
        required: true
  push:
    tags:
      - "v0.1.0-rc*"

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Build wheel + artifact bundle
        run: |
          python -m pip install -e ".[dev]" build
          python -m build
          mkdir -p artifacts
          cp dist/*.whl artifacts/ || true
          bash scripts/package_rc_artifacts.sh artifacts
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: rc-artifacts
          path: artifacts/

  attest:
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: rc-artifacts
          path: artifacts
      - name: Attest artifact directory
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: artifacts/*

  reproduce:
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: rc-artifacts
          path: artifacts
      - name: Reproduce checksums
        run: bash scripts/reproduce_release.sh artifacts
