name: CI

on:
  push:
    branches: ["main", "master", "recovery/**", "feature/**", "test/**", "docs/**", "release/**", "fix/**"]
  pull_request:
    branches: ["main", "master", "recovery/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lean build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          lint: false

  lean-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          lint: true

  axiom-audit:
    runs-on: ubuntu-latest
    needs: [lean-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync frozen deps
        run: uv sync --frozen --all-extras
      - name: Run axiom audit
        run: uv run python scripts/audit_axioms.py

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync frozen deps
        run: uv sync --frozen --all-extras
      - name: Ruff
        run: |
          uv run ruff check src/leanverifier tests scripts
          uv run ruff format --check src/leanverifier tests scripts
      - name: Mypy
        run: uv run mypy src/leanverifier
      - name: Pytest with coverage
        run: uv run python -m pytest tests --cov=src/leanverifier --cov-fail-under=70

  schema-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests/schema -k negative

  generator-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests/unit/test_generator_determinism.py

  integration-positive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests/integration -k positive

  integration-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests/integration -k 'not positive'

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python -m pytest tests/security tests/mutation

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run python scripts/verify_docs.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync frozen deps
        run: uv sync --frozen --all-extras
      - name: Build wheel and sdist
        run: uv build
      - name: Smoke install from /tmp (validate-model; verify opt-in)
        run: |
          # Packaging smoke: install wheel+sdist in a clean venv outside the checkout.
          # Full Lake verify requires elan/mathlib — enable with --require-verify in R-05
          # after lean-action is wired into this job.
          uv run python scripts/smoke_wheel.py --dist dist --artifact both

  clean-worktree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          lint: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync frozen deps
        run: uv sync --frozen --all-extras

      - name: Pytest (unit + schema subset)
        run: uv run python -m pytest tests/unit tests/schema -q

      - name: Axiom audit
        run: uv run python scripts/audit_axioms.py

      - name: Docs verify
        run: uv run python scripts/verify_docs.py

      - name: Generate outside checkout
        run: |
          OUT_DIR="${RUNNER_TEMP}/lv-clean-worktree-generate"
          mkdir -p "${OUT_DIR}"
          uv run leanverifier generate \
            --model examples/affine_binary/model.json \
            --request examples/affine_binary/request.json \
            --out-dir "${OUT_DIR}"

      - name: Worktree remains clean
        run: test -z "$(git status --porcelain)"
